name: verify-all-claims
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (numpy only)
        run: pip install -r requirements.txt
      - name: Run every verification suite
        run: python run_all_tests.py
      - name: Uneven-competence experiment (honest-negative check)
        run: python experiments/quasar_experiment2.py
