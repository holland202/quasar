[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar"
version = "0.1.1"
description = "Closed-loop learner that generates its own training data and curriculum"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chad Edward Holland"}]
dependencies = ["numpy"]

[tool.setuptools]
packages = ["quasar"]
