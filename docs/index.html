<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUASAR — Quantum Geometric Transformer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>QUASAR</h1>
        <p class="subtitle">Quantum-geometric Unified Self-training ARchitecture</p>
        
        <div class="controls">
            <div class="slider-group">
                <label>Rotation Speed (ω): <span id="val-w">0.5</span></label>
                <input type="range" id="w" min="0" max="2" step="0.01" value="0.5">
            </div>
            <div class="slider-group">
                <label>Decoherence (γ): <span id="val-g">0.05</span></label>
                <input type="range" id="g" min="0" max="0.3" step="0.01" value="0.05">
            </div>
            <div class="slider-group">
                <label>Time Steps: <span id="val-t">10</span></label>
                <input type="range" id="t" min="3" max="30" step="1" value="10">
            </div>
            <button id="learn-btn">Learn from Measurements</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="bloch-canvas" width="600" height="400"></canvas>
        </div>
        
        <div class="status" id="status">
            Physicality: <span id="physicality">VALID</span> | 
            Bures Path: <span id="bures-path">0.00</span>
        </div>
        
        <div class="info">
            <p>Every surface is a learned quantum channel. Drag sliders to deform the Bloch sphere.</p>
            <p>Push past the CP cone and the physicality certificate fails in real time.</p>
        </div>
    </div>
    <script src="quasar.js"></script>
</body>
</html>
